 name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run all tests
        run: mvn -B verify

  docker:
    # proves that the Docker image (the one the live server uses) really builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image (up to 3 tries)
        # Maven Central sometimes answers GitHub's servers with "429 Too Many Requests".
        # That is a temporary download problem, not a bug in the project, so we simply try again.
        run: |
          for i in 1 2 3; do
            docker build -t applyrank-backend . && exit 0
            echo "Build failed (try $i of 3). Waiting 45 seconds, then trying again..."
            sleep 45
          done
          echo "Docker build failed 3 times"
          exit 1