name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image with retry
        run: |
          for i in 1 2 3; do
            docker build -t applyrank-backend:ci . && exit 0
            echo "Attempt $i failed, waiting 45s before retry..."
            sleep 45
          done
          exit 1