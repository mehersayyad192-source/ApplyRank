# One command:  docker compose up --build      (API on http://localhost:8080, Swagger on /swagger-ui.html)
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: applyrank
      MYSQL_USER: applyrank
      MYSQL_PASSWORD: applyrank_pw
      MYSQL_ROOT_PASSWORD: root_pw
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pw"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/applyrank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: applyrank
      SPRING_DATASOURCE_PASSWORD: applyrank_pw
      JWT_SECRET: ${JWT_SECRET:-dev-only-compose-secret-change-me-0123456789abcdef}
    volumes:
      - uploads:/app/uploads

volumes:
  dbdata:
  uploads:
