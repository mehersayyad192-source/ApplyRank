<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password - ApplyRank</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth-pages.css"><script src="js/api.js"></script></head>
<body class="auth-body"><div class="auth-card"><div class="auth-logo">Apply<span>Rank</span></div>
<h1>Forgot your password?</h1>
<p>Type your email. If it is registered, we send a link to choose a new password. The link works for 30 minutes.</p>
<label for="em">EMAIL</label><input id="em" type="email" placeholder="you@example.com" autocomplete="email">
<button class="auth-btn" id="go">Send reset link</button>
<div class="auth-msg" id="msg"></div>
<div class="auth-hint">Running locally without email setup? The link is printed in the backend (VS Code) terminal.</div>
<a class="auth-back" href="index.html">&larr; Back to login</a></div>
<script>
document.getElementById('go').onclick = function () {
  var b = this, m = document.getElementById('msg'), e = document.getElementById('em').value.trim();
  m.className = 'auth-msg'; m.textContent = '';
  if (!e) { m.className = 'auth-msg err'; m.textContent = 'Please type your email.'; return; }
  b.disabled = true;
  ApplyRankAPI.forgotPassword(e).then(function (r) { m.className = 'auth-msg ok'; m.textContent = r.message; },
    function (x) { m.className = 'auth-msg err'; m.textContent = x.offline ? 'Backend is not running. Start it first.' : x.message; })
    .then(function () { b.disabled = false; });
};
</script></body></html>
