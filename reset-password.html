<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - ApplyRank</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth-pages.css"><script src="api.js"></script></head>
<body class="auth-body"><div class="auth-card"><div class="auth-logo">Apply<span>Rank</span></div>
<h1>Choose a new password</h1>
<p>At least 8 characters, with a letter and a number.</p>
<label for="p1">NEW PASSWORD</label><input id="p1" type="password" autocomplete="new-password">
<label for="p2">REPEAT PASSWORD</label><input id="p2" type="password" autocomplete="new-password">
<button class="auth-btn" id="go">Change password</button>
<div class="auth-msg" id="msg"></div>
<a class="auth-back" href="index.html">&larr; Back to login</a></div>
<script>
var tk = new URLSearchParams(location.search).get('token') || '';
var msg = document.getElementById('msg');
if (!tk) { msg.className = 'auth-msg err'; msg.textContent = 'This link is incomplete. Open the link from your email again.'; }
document.getElementById('go').onclick = function () {
  var b = this, p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
  msg.className = 'auth-msg'; msg.textContent = '';
  if (!tk) return;
  if (p1 !== p2) { msg.className = 'auth-msg err'; msg.textContent = 'The two passwords are not the same.'; return; }
  if (p1.length < 8 || !/[A-Za-z]/.test(p1) || !/\d/.test(p1)) { msg.className = 'auth-msg err'; msg.textContent = 'Use 8+ characters with at least one letter and one number.'; return; }
  b.disabled = true;
  ApplyRankAPI.resetPassword(tk, p1).then(function (r) {
    msg.className = 'auth-msg ok'; msg.textContent = r.message + ' Taking you to login...';
    setTimeout(function () { location.href = 'index.html'; }, 1800);
  }, function (x) { b.disabled = false; msg.className = 'auth-msg err'; msg.textContent = x.offline ? 'Backend is not running. Start it first.' : x.message; });
};
</script></body></html>
