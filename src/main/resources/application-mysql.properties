# Use with (PowerShell - keep the quotes!):  mvn spring-boot:run "-Dspring-boot.run.profiles=mysql"
# 1) Create the database once (MySQL Workbench or terminal):  CREATE DATABASE applyrank CHARACTER SET utf8mb4;
# 2) Put your MySQL password in the DB_PASSWORD environment variable (better than writing it in a file that goes to GitHub):
#      PowerShell:   $env:DB_PASSWORD = "your_mysql_password"
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/applyrank?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
