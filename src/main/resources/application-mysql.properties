# Use with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# 1) Create the database once:  CREATE DATABASE applyrank CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/applyrank?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
