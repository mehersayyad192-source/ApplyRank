# Settings for the LIVE server. Start with:  SPRING_PROFILES_ACTIVE=prod,mysql   (prod = these settings, mysql = real database)
# The server REFUSES to start if JWT_SECRET is still the demo value (see StartupChecks.java).
app.production=true

# Never expose the database console on the internet
spring.h2.console.enabled=false

# Behind the host's proxy every user has the proxy's address. This makes the app read the real address
# from the X-Forwarded-For header, so the rate limit works per user and not for everybody together.
server.forward-headers-strategy=native

# Finish running requests before stopping (no half-finished uploads when the host restarts the app)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Small free servers have little memory: create beans only when first needed, keep the database pool small
spring.main.lazy-initialization=true
spring.datasource.hikari.maximum-pool-size=5

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN

# Demo logins on the live server: NO public default. Set these two settings yourself, or the accounts get a random password.
app.demo.candidate-password=${DEMO_CANDIDATE_PASSWORD:}
app.demo.recruiter-password=${DEMO_RECRUITER_PASSWORD:}
