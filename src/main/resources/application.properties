# ---------- ApplyRank backend ----------
server.port=8080

# Default database: H2 file database (no installation needed). Data is kept in ./data/applyrank*.db
spring.datasource.url=jdbc:h2:file:./data/applyrank;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# H2 web console: http://localhost:8080/h2-console  (JDBC URL = the one above, user sa, empty password)
spring.h2.console.enabled=true

# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=./uploads

# JWT - CHANGE THE SECRET before deploying (at least 32 characters)
# Production: set the JWT_SECRET environment variable (random, 32+ chars). The fallback below is for local demo only.
app.jwt.secret=${JWT_SECRET:change-this-secret-before-deploying-applyrank-2026-xyz}
app.jwt.expiration-hours=24

# Which frontends may call the API (VS Code Live Server runs on 127.0.0.1:5500)
app.cors.origins=${CORS_ORIGINS:http://127.0.0.1:*,http://localhost:*}

# Do not leak stack traces / internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- e-mail (password reset / verify e-mail) ----------
# Where the website lives (used inside e-mail links). Live Server default:
app.frontend-url=${FRONTEND_URL:http://127.0.0.1:5500}
app.mail.from=${MAIL_FROM:no-reply@applyrank.dev}
# If true, users must verify their e-mail before applying to a job. Keep false locally, set true when deployed.
app.auth.require-verified-email=${REQUIRE_VERIFIED_EMAIL:false}
# NO SMTP set = DEV MODE: links are printed in the backend console. For real e-mails add (example: Gmail + App Password):
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=you@gmail.com
#   spring.mail.password=YOUR_16_CHAR_APP_PASSWORD
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- abuse protection ----------
# max API requests per minute per IP address (429 after that)
app.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:300}
