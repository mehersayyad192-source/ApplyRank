# ---------- ApplyRank backend ----------
# PORT is set by most hosting services (Render, etc.); locally it stays 8080
server.port=${PORT:8080}

# Default database: H2 file database (no installation needed). Data is kept in ./data/applyrank*.db
spring.datasource.url=jdbc:h2:file:./data/applyrank;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# H2 web console: http://localhost:8080/h2-console  (JDBC URL = the one above, user sa, empty password)
spring.h2.console.enabled=true

# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=./uploads

# JWT - CHANGE THE SECRET before deploying (at least 32 characters)
# Production: set the JWT_SECRET environment variable (random, 32+ chars). The fallback below is for local demo only.
app.jwt.secret=${JWT_SECRET:change-this-secret-before-deploying-applyrank-2026-xyz}
app.jwt.expiration-hours=24

# Which frontends may call the API (VS Code Live Server runs on 127.0.0.1:5500)
app.cors.origins=${CORS_ORIGINS:http://127.0.0.1:*,http://localhost:*}

# Production switch: the "prod" profile sets this to true (see application-prod.properties)
app.production=${APP_PRODUCTION:false}

# Log format: time, level, request id, short logger name, message
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{rid:-}] %logger{20} - %msg%n

# Demo logins created on the very first start (local use). The live server overrides these, see application-prod.properties
app.demo.candidate-password=${DEMO_CANDIDATE_PASSWORD:Demo@1234}
app.demo.recruiter-password=${DEMO_RECRUITER_PASSWORD:Recruiter@123}

# Do not leak stack traces / internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- e-mail (password reset / verify e-mail) ----------
# Where the website lives (used inside e-mail links). Live Server default:
app.frontend-url=${FRONTEND_URL:http://127.0.0.1:5500}
app.mail.from=${MAIL_FROM:no-reply@applyrank.dev}
# If true, users must verify their e-mail before applying to a job. Keep false locally, set true when deployed.
app.auth.require-verified-email=${REQUIRE_VERIFIED_EMAIL:false}
# NO SMTP set = DEV MODE: links are printed in the backend console. For real e-mails add (example: Gmail + App Password):
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=you@gmail.com
#   spring.mail.password=YOUR_16_CHAR_APP_PASSWORD
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- abuse protection ----------
# max API requests per minute per IP address (429 after that)
app.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:300}

# ---------- AI Lab (Code Review Coach and the other AI tools) ----------
# The API key lives ONLY here on the backend (never in the website files). Leave it empty and the AI Lab still works
# with its built-in rules; it just skips the extra AI comments.
# Set it in the terminal before starting:  $env:GEMINI_API_KEY="your key"   (PowerShell)
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.ai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
# How many AI-powered checks one user may run per hour (keeps the free quota from running out)
app.ai.hourly-quota=${AI_HOURLY_QUOTA:10}
# Biggest piece of code accepted in one check (characters)
app.ai.max-input-chars=12000
# Pages are longer than code files, so the Page Auditor accepts more (characters of pasted HTML)
app.ai.max-page-chars=40000
