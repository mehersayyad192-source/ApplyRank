# ---------- ApplyRank backend ----------
server.port=8080

# Default database: H2 file database (no installation needed). Data is kept in ./data/applyrank*.db
spring.datasource.url=jdbc:h2:file:./data/applyrank;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# H2 web console: http://localhost:8080/h2-console  (JDBC URL = the one above, user sa, empty password)
spring.h2.console.enabled=true

# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=./uploads

# JWT - CHANGE THE SECRET before deploying (at least 32 characters)
# Production: set the JWT_SECRET environment variable (random, 32+ chars). The fallback below is for local demo only.
app.jwt.secret=${JWT_SECRET:change-this-secret-before-deploying-applyrank-2026-xyz}
app.jwt.expiration-hours=24

# Which frontends may call the API (VS Code Live Server runs on 127.0.0.1:5500)
app.cors.origins=http://127.0.0.1:*,http://localhost:*

# Do not leak stack traces / internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
